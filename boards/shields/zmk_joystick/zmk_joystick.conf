# Enable ADC and async sampling
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y

# Enable ZMK Pointing and Analog Input Driver
CONFIG_ZMK_POINTING=y
CONFIG_ANALOG_INPUT=y

# Optional: minimum report interval in ms
# CONFIG_ANALOG_INPUT_REPORT_INTERVAL_MIN=22

# Calibration & Debugging
# Uncomment below (along with `snippet: zmk-usb-logging` in build.yaml) to inspect
# raw and processed millivolt readings over USB serial.
# CONFIG_ANALOG_INPUT_LOG_LEVEL_DBG=y
# CONFIG_ANALOG_INPUT_LOG_DBG_RAW=y
# CONFIG_ANALOG_INPUT_LOG_DBG_REPORT=y
